version: '3.8'

services:
  database:
    image: mongo:latest
    container_name: topics-db
    ports:
      - "27017:27017"
    environment:
      # Mantenemos las credenciales que hicieron funcionar tu contenedor en el reto 3
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=superpassword
    volumes:
      - mongo-data:/data/db
    networks:
      - lemoncode-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topics-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      # Corregido: Nombre correcto de variable (DATABASE_URL) y uso de credenciales
      - DATABASE_URL=mongodb://admin:superpassword@topics-db:27017
    networks:
      - lemoncode-network
    depends_on:
      database:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mi-frontend-topics
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Corregido: Apunta al contenedor 'topics-api' por red de Docker como exige el reto
      - API_URL=http://topics-api:5000/api/classes
    networks:
      - lemoncode-network
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
    driver: local

networks:
  lemoncode-network:
    driver: bridge
